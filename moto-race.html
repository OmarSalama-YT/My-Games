<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moto City 3D - Direct Controls</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; max-width: 1000px; max-height: 800px; background: #87CEEB; overflow: hidden; touch-action: none; box-shadow: 0 0 50px rgba(0, 0, 0, 0.8); }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
        
        /* HUD */
        #ui { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; pointer-events: none; z-index: 10; }
        .hud { background: rgba(0, 0, 0, 0.85); border: 2px solid #ffcc00; border-radius: 8px; padding: 10px 15px; color: #ffcc00; font-size: 16px; font-weight: bold; font-family: monospace; display: flex; align-items: center; gap: 8px; }
        
        /* Fuel Bar */
        #fuelContainer { width: 100px; height: 15px; background: #333; border-radius: 10px; overflow: hidden; border: 1px solid #555; margin-left: 10px; }
        #fuelBar { height: 100%; width: 100%; background: #00ff00; transition: width 0.3s, background 0.3s; }

        /* شاشة البداية */
        #startScreen { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: #fff; text-align: center; padding: 20px; }
        h1 { font-size: 42px; color: #ffcc00; text-shadow: 0 0 20px #ff9900; margin-bottom: 10px; font-family: Impact, sans-serif; }
        .subtitle { font-size: 18px; color: #ccc; margin-bottom: 20px; }
        .controls-info { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-bottom: 30px; line-height: 1.8; text-align: right; }
        button { padding: 15px 60px; font-size: 22px; font-weight: bold; background: linear-gradient(135deg, #ffcc00, #ff9900); border: none; border-radius: 8px; color: #000; cursor: pointer; pointer-events: all; font-family: inherit; }
        button:active { transform: scale(0.95); }

        /* رسائل التنبيه */
        #alertMessage { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); border: 2px solid #ff0000; color: #ff0000; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; display: none; z-index: 20; text-align: center; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div class="hud" id="coinHud">💰 $0</div>
            <div class="hud" style="border-color: #00ff00; color: #00ff00;">
                ⛽ <div id="fuelContainer"><div id="fuelBar"></div></div>
            </div>
            <div class="hud" id="speedHud">0 KM/H</div>
        </div>

        <div id="alertMessage">⛽ نفد البنزين! اذهب للمحطة الخضراء.</div>

        <div id="startScreen">
            <h1>MOTO CITY 3D</h1>
            <div class="subtitle">تحكم مباشر (W-A-S-D)</div>
            <div class="controls-info">
                <b>⌨️ الكمبيوتر:</b><br>
                W = أمام | S = خلف<br>
                A = يسار | D = يمين<br>
                <i>(أو استخدم الأسهم)</i><br><br>
                <b>📱 الهاتف:</b><br>
                اسحب إصبعك في الاتجاه المطلوب
            </div>
            <button id="startBtn">انطلق 🏍️</button>
        </div>
    </div>

    <!-- استدعاء مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const container = document.getElementById('gameContainer');
            const startScreen = document.getElementById('startScreen');
            const startBtn = document.getElementById('startBtn');
            const coinHud = document.getElementById('coinHud');
            const fuelBar = document.getElementById('fuelBar');
            const speedHud = document.getElementById('speedHud');
            const alertMessage = document.getElementById('alertMessage');

            let W, H;
            let gameState = 'start';
            let coins = 0;
            let fuel = 100;
            let isBrokeDown = false;

            // --- إعداد مشهد Three.js ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // لون السماء
            scene.fog = new THREE.Fog(0x87CEEB, 50, 200); // ضباب للمدى البعيد

            const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 500);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false }); // antialias: false للأداء
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;

            // إضاءة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // --- بناء العالم 3D ---
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // المباني
            const buildingsGroup = new THREE.Group();
            const buildingColors = [0x4a5568, 0x2d3748, 0x718096, 0xe53e3e, 0x3182ce];
            
            for (let i = -4; i <= 4; i++) {
                for (let j = -4; j <= 4; j++) {
                    if (i % 2 === 0 || j % 2 === 0) continue; // شوارع
                    
                    const w = 15 + Math.random() * 10;
                    const h = 20 + Math.random() * 40;
                    const d = 15 + Math.random() * 10;

                    const geo = new THREE.BoxGeometry(w, h, d);
                    const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                    const mat = new THREE.MeshStandardMaterial({ color: color });
                    const building = new THREE.Mesh(geo, mat);
                    
                    building.position.set(i * 30, h / 2, j * 30);
                    building.castShadow = true;
                    building.receiveShadow = true;
                    buildingsGroup.add(building);
                }
            }
            scene.add(buildingsGroup);

            // اللاعب (الموتوسيكل)
            const bikeGroup = new THREE.Group();
            const bikeBodyGeo = new THREE.BoxGeometry(1.5, 1.5, 3);
            const bikeBodyMat = new THREE.MeshStandardMaterial({ color: 0xe53e3e });
            const bikeBody = new THREE.Mesh(bikeBodyGeo, bikeBodyMat);
            bikeBody.position.y = 1;
            bikeBody.castShadow = true;
            bikeGroup.add(bikeBody);

            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 8);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            
            const wheelFront = new THREE.Mesh(wheelGeo, wheelMat);
            wheelFront.rotation.z = Math.PI / 2;
            wheelFront.position.set(0, 0.5, 1.2);
            wheelFront.castShadow = true;
            bikeGroup.add(wheelFront);

            const wheelBack = new THREE.Mesh(wheelGeo, wheelMat);
            wheelBack.rotation.z = Math.PI / 2;
            wheelBack.position.set(0, 0.5, -1.2);
            wheelBack.castShadow = true;
            bikeGroup.add(wheelBack);

            const driverGeo = new THREE.SphereGeometry(0.6, 8, 8);
            const driverMat = new THREE.MeshStandardMaterial({ color: 0x00c8ff });
            const driver = new THREE.Mesh(driverGeo, driverMat);
            driver.position.set(0, 1.8, 0);
            driver.castShadow = true;
            bikeGroup.add(driver);

            scene.add(bikeGroup);

            // محطة بنزين
            const gasMarker = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2, 10, 16),
                new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00 })
            );
            gasMarker.position.set(30, 5, -30);
            scene.add(gasMarker);

            // العملات
            const coinsGroup = new THREE.Group();
            const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 8);
            const coinMat = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00ff00 });

            for (let i = 0; i < 20; i++) {
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set((Math.random() - 0.5) * 200, 1, (Math.random() - 0.5) * 200);
                coinsGroup.add(coin);
            }
            scene.add(coinsGroup);

            // --- الفيزياء المباشرة ---
            const player = {
                x: 0, z: 0,
                vx: 0, vz: 0,
                speed: 0,
                maxSpeed: 0.8,
                accel: 0.05,
                friction: 0.9,
                angle: 0
            };

            const keys = {};
            let touchX = 0, touchY = 0, hasTouch = false;

            // --- التحكم ---
            window.addEventListener('keydown', (e) => {
                if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    e.preventDefault();
                }
                keys[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
                hasTouch = true;
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                touchX = e.touches[0].clientX - rect.left;
                touchY = e.touches[0].clientY - rect.top;
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => { e.preventDefault(); hasTouch = false; }, { passive: false });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            function resize() {
                W = container.clientWidth; H = container.clientHeight;
                camera.aspect = W / H;
                camera.updateProjectionMatrix();
                renderer.setSize(W, H);
            }
            window.addEventListener('resize', resize);
            resize();

            startBtn.addEventListener('click', () => {
                gameState = 'playing';
                startScreen.style.display = 'none';
                player.x = 0; player.z = 0;
                player.vx = 0; player.vz = 0;
                player.speed = 0;
                fuel = 100; coins = 0; isBrokeDown = false;
                updateHUD();
            });

            function updateHUD() {
                coinHud.textContent = '💰 $' + coins;
                fuelBar.style.width = Math.max(0, fuel) + '%';
                if (fuel < 20) fuelBar.style.background = '#ff0000';
                else if (fuel < 50) fuelBar.style.background = '#ffaa00';
                else fuelBar.style.background = '#00ff00';
                speedHud.textContent = Math.round(player.speed * 30) + ' KM/H';
            }

            function update() {
                if (gameState !== 'playing') return;

                // 1. الحركة المباشرة
                let moveX = 0;
                let moveZ = 0;

                if (keys['w'] || keys['arrowup']) moveZ -= 1;
                if (keys['s'] || keys['arrowdown']) moveZ += 1;
                if (keys['a'] || keys['arrowleft']) moveX -= 1;
                if (keys['d'] || keys['arrowright']) moveX += 1;

                // اللمس
                if (hasTouch) {
                    const dx = touchX - W / 2;
                    const dy = touchY - H / 2;
                    if (Math.hypot(dx, dy) > 20) {
                        const dist = Math.hypot(dx, dy);
                        moveX += dx / dist;
                        moveZ += dy / dist;
                    }
                }

                // تطبيع
                const moveDist = Math.hypot(moveX, moveZ);
                if (moveDist > 0) {
                    moveX /= moveDist;
                    moveZ /= moveDist;
                    player.vx += moveX * player.accel;
                    player.vz += moveZ * player.accel;
                }

                player.vx *= player.friction;
                player.vz *= player.friction;

                const currentSpeed = Math.hypot(player.vx, player.vz);
                if (currentSpeed > player.maxSpeed) {
                    player.vx = (player.vx / currentSpeed) * player.maxSpeed;
                    player.vz = (player.vz / currentSpeed) * player.maxSpeed;
                }

                player.speed = Math.hypot(player.vx, player.vz);
                player.x += player.vx;
                player.z += player.vz;

                // تدوير الموتوسيكل نحو اتجاه الحركة
                if (player.speed > 0.05) {
                    const targetAngle = Math.atan2(player.vx, player.vz);
                    let diff = targetAngle - player.angle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    player.angle += diff * 0.15;
                }

                // تحديث موقع الموتوسيكل في الـ 3D
                bikeGroup.position.set(player.x, 0, player.z);
                bikeGroup.rotation.y = player.angle;

                // 2. استهلاك البنزين
                if (player.speed > 0.01 && fuel > 0) {
                    fuel -= 0.05;
                    if (fuel <= 0) {
                        fuel = 0;
                        isBrokeDown = true;
                        alertMessage.style.display = 'block';
                    }
                }

                // 3. جمع العملات
                coinsGroup.children.forEach(coin => {
                    if (!coin.collected) {
                        const cdx = player.x - coin.position.x;
                        const cdz = player.z - coin.position.z;
                        if (Math.hypot(cdx, cdz) < 3) {
                            coin.collected = true;
                            coins += 50;
                            scene.remove(coin);
                            updateHUD();
                        }
                    }
                });

                // 4. محطة البنزين
                const gasDist = Math.hypot(player.x - gasMarker.position.x, player.z - gasMarker.position.z);
                if (gasDist < 5) {
                    fuel = Math.min(100, fuel + 2);
                    if (isBrokeDown && fuel > 10) {
                        isBrokeDown = false;
                        alertMessage.style.display = 'none';
                    }
                    updateHUD();
                }

                // 5. الكاميرا (تتبع من الأعلى والخلف)
                const camDist = 12;
                const camHeight = 8;
                const camX = player.x - Math.sin(player.angle) * camDist;
                const camZ = player.z - Math.cos(player.angle) * camDist;
                
                camera.position.x += (camX - camera.position.x) * 0.1;
                camera.position.z += (camZ - camera.position.z) * 0.1;
                camera.position.y = camHeight;
                camera.lookAt(player.x, 1, player.z);

                updateHUD();
            }

            function animate() {
                requestAnimationFrame(animate);
                update();
                renderer.render(scene, camera);
            }

            animate();
        })();
    </script>
</body>
</html>
